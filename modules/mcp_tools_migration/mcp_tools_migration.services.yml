services:
  mcp_tools_migration.migration:
    class: Drupal\mcp_tools_migration\Service\MigrationService
    arguments:
      - '@entity_type.manager'
      - '@entity_field.manager'
      - '@mcp_tools.access_manager'
      - '@mcp_tools.audit_logger'
      - '@mcp_tools_migration.migrate_import'
      - '@mcp_tools.link_target'
  mcp_tools_migration.migrate_import:
    class: Drupal\mcp_tools_migration\Service\MigrateImport
    arguments:
      - '@entity_type.manager'
      - '@?plugin.manager.migration'
      - '@event_dispatcher'
      - '@keyvalue'
