mcp_tools.servers:
  type: config_object
  label: 'MCP Tools server profiles'
  mapping:
    default_server:
      type: string
      label: 'Default server profile ID'
    servers:
      # A site names its profiles as it likes, so this is a sequence keyed by
      # profile ID. As a mapping with a '*' key, any profile other than the
      # four shipped ones had no schema.
      type: sequence
      label: 'Server profiles'
      orderby: key
      sequence:
        type: mcp_tools.server_profile
        label: 'Server profile'

mcp_tools.server_profile:
  type: mapping
  label: 'Server profile'
  mapping:
    name:
      type: string
      label: 'Server name'
    version:
      type: string
      label: 'Server version'
    pagination_limit:
      type: integer
      label: 'Pagination limit'
    include_all_tools:
      type: boolean
      label: 'Expose all Tool API tools'
    gateway_mode:
      type: boolean
      label: 'Enable gateway mode'
    enable_resources:
      type: boolean
      label: 'Enable resources'
    enable_prompts:
      type: boolean
      label: 'Enable prompts'
    transports:
      type: sequence
      label: 'Allowed transports'
      sequence:
        type: string
        label: 'Transport'
    enabled:
      type: boolean
      label: 'Enabled'
    scopes:
      type: sequence
      label: 'Default scopes'
      sequence:
        type: string
        label: 'Scope'
    permission_callback:
      type: string
      label: 'Permission callback'
