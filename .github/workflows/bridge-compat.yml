# =============================================================================
# Weekly compatibility check: mcp_tools served via mcp_server_tool_bridge
#
# mcp_server_tool_bridge (e0ipso's companion project for mcp_server 2.x) is
# the supported way to serve this tool library through mcp_server. Both are
# pre-release and move fast; this job catches their churn breaking our users
# before the issue queue does. See scripts/bridge_compat.php for what is
# asserted.
# =============================================================================

name: Bridge Compat

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  bridge-compat:
    name: mcp_tools via mcp_server_tool_bridge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, gd, dom, xml, sqlite3, pdo_sqlite
          tools: composer
          coverage: none

      - name: Install Drupal with MCP stack
        run: |
          composer config --global policy.advisories.block false
          composer create-project drupal/recommended-project:^11 drupal --no-interaction
          cd drupal
          composer require drush/drush --no-interaction
          composer require drupal/tool:1.0.0-beta2 mcp/sdk:^0.6 code-wheel/mcp-http-security:^1.0 code-wheel/mcp-error-codes:^1.3 code-wheel/mcp-events:^2.0 code-wheel/mcp-schema-builder:^1.1 code-wheel/mcp-tool-gateway:^1.2 enshrined/svg-sanitize:^0.22 -W --no-interaction
          composer require "drupal/mcp_server:^2.0@alpha" -W --no-interaction

      - name: Clone mcp_server_tool_bridge (1.x dev — no tagged release yet)
        run: |
          git clone --depth 1 https://git.drupalcode.org/project/mcp_server_tool_bridge.git \
            drupal/web/modules/contrib/mcp_server_tool_bridge

      - name: Copy MCP Tools module
        run: |
          mkdir -p drupal/web/modules/contrib/mcp_tools
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.ddev' \
            --exclude='docs' \
            --exclude='scripts' \
            --exclude='drupal' \
            --exclude='vendor' \
            --exclude='.phpunit.cache' \
            ./ drupal/web/modules/contrib/mcp_tools/

      - name: Install Drupal site
        run: |
          cd drupal
          ./vendor/bin/drush site:install minimal \
            --db-url=sqlite://sites/default/files/.ht.sqlite \
            --site-name="Bridge Compat" -y

      - name: Enable modules
        run: |
          cd drupal
          ./vendor/bin/drush en tool dblog update node field text filter \
            mcp_tools mcp_tools_content mcp_server mcp_server_tool_bridge -y

      # The compat script lives only in the dev repo; the public mirror
      # strips scripts/ on sync. Skip gracefully there instead of failing.
      - name: Run bridge compatibility script
        run: |
          if [ -f scripts/bridge_compat.php ]; then
            cd drupal
            ./vendor/bin/drush php:script ../scripts/bridge_compat.php
          else
            echo "scripts/ not present (public mirror) — skipping"
          fi
