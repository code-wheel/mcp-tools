# =============================================================================
# Full Tool Registration Workflow
# Installs optional contrib dependencies and verifies all 227 tools register.
# Intended for scheduled/manual runs (not every PR) to keep CI fast and stable.
# =============================================================================

name: Full Tool Registration

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * 0'

jobs:
  all-tools-register:
    name: Verify All 227 Tools Register
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: drupal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, gd, dom, xml
          tools: composer

      - name: Install Drupal + dependencies
        run: |
          composer config --global policy.advisories.block false
          composer create-project drupal/recommended-project:^10.3 drupal --no-interaction
          cd drupal
          # consolidation/robo 5.2.1 to 5.2.3 (2026-11-12) call
          # Application::addCommand(), which Symfony Console 6.4 (Drupal 10)
          # lacks, so every drush command fatals. Remove once fixed upstream.
          composer require drush/drush "consolidation/robo:<5.2.1" --no-interaction
          composer require drupal/tool:^1.0.0-beta9 mcp/sdk:^0.10 -W --no-interaction
          composer require code-wheel/mcp-http-security:^1.0 code-wheel/mcp-error-codes:^1.3 code-wheel/mcp-events:^2.0 code-wheel/mcp-schema-builder:^1.1 code-wheel/mcp-tool-gateway:^1.2.1 "enshrined/svg-sanitize:^0.22 || ^1.0" -W --no-interaction

          # Optional contrib dependencies for all submodules.
          composer require \
            drupal/entity_clone:^2@beta \
            drupal/metatag \
            drupal/paragraphs \
            drupal/pathauto \
            drupal/redirect \
            drupal/scheduler \
            drupal/search_api \
            drupal/simple_sitemap \
            drupal/ultimate_cron:^2@beta \
            drupal/webform \
            --no-interaction

      - name: Copy MCP Tools module
        run: |
          mkdir -p drupal/web/modules/contrib/mcp_tools
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.ddev' \
            --exclude='docs' \
            --exclude='scripts' \
            --exclude='drupal' \
            --exclude='vendor' \
            --exclude='.phpunit.cache' \
            ./ drupal/web/modules/contrib/mcp_tools/

      - name: Install Drupal
        run: |
          cd drupal
          ./vendor/bin/drush site:install minimal \
            --db-url=mysql://root:root@127.0.0.1/drupal \
            --site-name="MCP Tools Test" \
            -y

      - name: Enable MCP Tools + all submodules
        run: |
          cd drupal
          ./vendor/bin/drush en tool dblog update -y
          ./vendor/bin/drush en mcp_tools -y
          ./vendor/bin/drush en mcp_tools_stdio mcp_tools_remote -y

          # Enable all submodules.
          for module in mcp_tools_analysis mcp_tools_batch mcp_tools_blocks mcp_tools_cache mcp_tools_config \
                        mcp_tools_content mcp_tools_cron mcp_tools_entity_clone mcp_tools_image_styles \
                        mcp_tools_jsonapi mcp_tools_layout_builder mcp_tools_media mcp_tools_menus mcp_tools_metatag \
                        mcp_tools_migration mcp_tools_moderation mcp_tools_paragraphs mcp_tools_pathauto \
                        mcp_tools_recipes mcp_tools_redirect mcp_tools_scheduler mcp_tools_search_api \
                        mcp_tools_sitemap mcp_tools_structure mcp_tools_templates mcp_tools_theme mcp_tools_translate \
                        mcp_tools_ultimate_cron mcp_tools_users mcp_tools_views mcp_tools_webform \
                        mcp_tools_remote_media; do
            ./vendor/bin/drush en "$module" -y
          done
          ./vendor/bin/drush cr

      - name: Verify tool registration count
        run: |
          cd drupal
          MCP_TOOL_COUNT=$(./vendor/bin/drush eval '$defs = \Drupal::service("plugin.manager.tool")->getDefinitions(); $defs = array_filter($defs, static fn($def): bool => str_starts_with($def->getProvider(), "mcp_tools")); echo count($defs);')
          echo "Registered MCP Tools tools: $MCP_TOOL_COUNT"

          if [ "$MCP_TOOL_COUNT" -ne 227 ]; then
            echo "ERROR: Expected 227 MCP Tools tools, found $MCP_TOOL_COUNT"
            exit 1
          fi
          echo "✓ All tools registered (227)"

      - name: Verify all tool schemas convert
        run: |
          cd drupal
          PHP_CODE=$(cat <<'PHP'
          $toolManager = \Drupal::service('plugin.manager.tool');
          $definitions = $toolManager->getDefinitions();
          $definitions = array_filter(
            $definitions,
            static fn(mixed $definition): bool => $definition instanceof \Drupal\tool\Tool\ToolDefinition && str_starts_with((string) $definition->getProvider(), 'mcp_tools')
          );

          $converter = new \Drupal\mcp_tools\Mcp\ToolApiSchemaConverter();

          foreach ($definitions as $pluginId => $definition) {
            try {
              $converter->toolDefinitionToAnnotations($definition);
              $schema = $converter->toolDefinitionToInputSchema($definition);
              $encoded = json_encode($schema);
              if ($encoded === FALSE) {
                throw new \RuntimeException('json_encode failed: ' . json_last_error_msg());
              }
            }
            catch (\Throwable $e) {
              fwrite(STDERR, "Schema conversion failed for {$pluginId}: {$e->getMessage()}\n");
              exit(1);
            }
          }

          echo "✓ All tool schemas converted (" . count($definitions) . ")\n";
          PHP
          )
          ./vendor/bin/drush eval "$PHP_CODE"

      # The unit tests of these five submodules are left out of the other
      # jobs, where their contrib classes are missing. This is the one job
      # that has the classes, so it is the one place they can run.
      - name: Unit tests that need the contrib modules
        run: |
          cd drupal
          composer require --dev "drupal/core-dev:^10.3" phpspec/prophecy-phpunit:^2 -W --no-interaction
          for module in mcp_tools_pathauto mcp_tools_scheduler mcp_tools_sitemap mcp_tools_ultimate_cron mcp_tools_search_api; do
            ./vendor/bin/phpunit -c "$PWD/web/core/phpunit.xml.dist" "web/modules/contrib/mcp_tools/modules/$module/tests/src/Unit"
          done

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # Calls all 227 tools with real arguments through the STDIO server
      # and the official JS SDK client. The script lives only in the dev
      # repo; the public mirror strips scripts/ on sync.
      - name: Call every tool for real
        run: |
          if [ -f scripts/mcp_tool_scenarios.mjs ]; then
            npm install --no-save --no-package-lock @modelcontextprotocol/sdk zod
            node scripts/mcp_tool_scenarios.mjs --drupal-root drupal
          else
            echo "scripts/ not present (public mirror), skipping"
          fi
